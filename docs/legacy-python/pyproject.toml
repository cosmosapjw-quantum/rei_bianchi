[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"

[project]
name="rei-bianchi"
version="0.1.0.dev0"
description="Durable Bianchi reionization research harness"
requires-python=">=3.12"
dependencies=["numpy>=2.3","scipy>=1.17","pandas>=2.2","sympy>=1.13","mpmath>=1.3"]

[tool.setuptools.packages.find]
where=["src"]
