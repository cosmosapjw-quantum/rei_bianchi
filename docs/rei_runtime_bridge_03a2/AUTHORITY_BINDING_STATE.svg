<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">REI final-attempt authority binding</title>
  <desc id="desc">Comparison of the current PR45 authorization path and the required hardened path before the one remaining native attempt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#222"/>
    </marker>
    <style>
      .node { fill: #fff; stroke: #222; stroke-width: 1.5; rx: 8; ry: 8; }
      .risk { fill: #eee; stroke: #222; stroke-width: 2; rx: 8; ry: 8; }
      .label { font-family: sans-serif; font-size: 17px; text-anchor: middle; dominant-baseline: middle; }
      .row { font-family: sans-serif; font-size: 21px; font-weight: bold; }
      .arrow { stroke: #222; stroke-width: 1.8; marker-end: url(#arrow); }
      .note { font-family: sans-serif; font-size: 16px; }
    </style>
  </defs>

  <text x="40" y="45" class="row">Current PR #45</text>
  <rect x="35" y="78" width="150" height="62" class="node"/>
  <text x="110" y="109" class="label"><tspan x="110" dy="-10">Verify</tspan><tspan x="110" dy="22">repository</tspan></text>
  <line x1="185" y1="109" x2="218" y2="109" class="arrow"/>
  <rect x="220" y="78" width="170" height="62" class="risk"/>
  <text x="305" y="109" class="label"><tspan x="305" dy="-10">Self-check copied</tspan><tspan x="305" dy="22">package</tspan></text>
  <line x1="390" y1="109" x2="423" y2="109" class="arrow"/>
  <rect x="425" y="78" width="170" height="62" class="risk"/>
  <text x="510" y="109" class="label"><tspan x="510" dy="-10">Configurable</tspan><tspan x="510" dy="22">API authority</tspan></text>
  <line x1="595" y1="109" x2="628" y2="109" class="arrow"/>
  <rect x="630" y="78" width="145" height="62" class="node"/>
  <text x="702" y="109" class="label"><tspan x="702" dy="-10">Local</tspan><tspan x="702" dy="22">lease</tspan></text>
  <line x1="775" y1="109" x2="808" y2="109" class="arrow"/>
  <rect x="810" y="78" width="145" height="62" class="node"/>
  <text x="882" y="109" class="label"><tspan x="882" dy="-10">Dispatch</tspan><tspan x="882" dy="22">intent</tspan></text>
  <line x1="955" y1="109" x2="988" y2="109" class="arrow"/>
  <rect x="990" y="78" width="165" height="62" class="node"/>
  <text x="1072" y="109" class="label"><tspan x="1072" dy="-10">Native</tspan><tspan x="1072" dy="22">worker</tspan></text>

  <text x="40" y="235" class="row">Required 03A3</text>
  <rect x="20" y="270" width="130" height="62" class="node"/>
  <text x="85" y="301" class="label"><tspan x="85" dy="-10">Verify</tspan><tspan x="85" dy="22">repository</tspan></text>
  <line x1="150" y1="301" x2="168" y2="301" class="arrow"/>
  <rect x="170" y="270" width="165" height="62" class="node"/>
  <text x="252" y="301" class="label"><tspan x="252" dy="-10">Bind package</tspan><tspan x="252" dy="22">to HEAD blobs</tspan></text>
  <line x1="335" y1="301" x2="353" y2="301" class="arrow"/>
  <rect x="355" y="270" width="145" height="62" class="node"/>
  <text x="427" y="301" class="label"><tspan x="427" dy="-10">Fixed GitHub</tspan><tspan x="427" dy="22">authority</tspan></text>
  <line x1="500" y1="301" x2="518" y2="301" class="arrow"/>
  <rect x="520" y="270" width="155" height="62" class="node"/>
  <text x="597" y="301" class="label"><tspan x="597" dy="-10">Exact 404 ×2</tspan><tspan x="597" dy="22">and path receipt</tspan></text>
  <line x1="675" y1="301" x2="693" y2="301" class="arrow"/>
  <rect x="695" y="270" width="145" height="62" class="node"/>
  <text x="767" y="301" class="label"><tspan x="767" dy="-10">13-field</tspan><tspan x="767" dy="22">recheck</tspan></text>
  <line x1="840" y1="301" x2="858" y2="301" class="arrow"/>
  <rect x="860" y="270" width="145" height="62" class="node"/>
  <text x="932" y="301" class="label"><tspan x="932" dy="-10">Protected</tspan><tspan x="932" dy="22">global lease</tspan></text>
  <line x1="1005" y1="301" x2="1023" y2="301" class="arrow"/>
  <rect x="1025" y="270" width="150" height="62" class="node"/>
  <text x="1100" y="301" class="label"><tspan x="1100" dy="-10">Local lease</tspan><tspan x="1100" dy="22">then worker</tspan></text>

  <text x="40" y="400" class="note">Narrow surviving claim: production import is post-lease.</text>
  <text x="40" y="432" class="note">Rejected broader claim: the final attempt is not yet bound to fixed remote authority and exact executing bytes.</text>
  <text x="40" y="464" class="note">No global ref, local lease, dispatch intent, or native runtime was created by the RED node.</text>
</svg>
