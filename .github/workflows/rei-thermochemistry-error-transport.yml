name: rei-thermochemistry-error-transport
on:
  push:
    branches: [research/rei-thermochemistry-error-transport-20260907-r1]
  pull_request:
    paths:
      - 'research/rei_thermochemistry_error_transport_20260907/**'
      - '.github/workflows/rei-thermochemistry-error-transport.yml'
permissions:
  contents: read
jobs:
  exact-research-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-source rational checks
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor 54a879231c68734fdda6990d67d8458d2918943e HEAD
          OUT="$RUNNER_TEMP/rei-chemistry-bound"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/TREE.txt"
          python3 -B research/rei_thermochemistry_error_transport_20260907/verify_bounds.py \
            --report "$OUT/RESULT.json" 2>&1 | tee "$OUT/exact-checks.log"
          python3 -B scripts/verify_repo.py 2>&1 | tee "$OUT/repository.log"
          git diff --check 54a879231c68734fdda6990d67d8458d2918943e HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/rei-chemistry-bound"
          if test -d "$OUT"; then
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rei-chemistry-bound-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: ${{ runner.temp }}/rei-chemistry-bound/
          if-no-files-found: error
