name: rei-runtime-03a4-cross-cas-ordering-green

on:
  push:
    branches:
      - audit/rei-runtime-03a4-cross-cas-ordering-20260904-r1
  pull_request:
    paths:
      - "docs/rei_runtime_bridge_03a4_cross_cas/**"
      - "tests/governance/test_rei_runtime_03a4_cross_cas_ordering_red.py"
      - ".github/workflows/rei-runtime-03a4-cross-cas-ordering-*.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REI_NATIVE_DISPATCH_FORBIDDEN: "1"
  PYTHONHASHSEED: "0"

jobs:
  sympy-mpmath:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact RED ancestry and compile source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            6ea848a189b37782b297b373c545f77ded395960 HEAD
          python -m py_compile \
            docs/rei_runtime_bridge_03a4_cross_cas/cross_cas_contract.py \
            tests/governance/test_rei_runtime_03a4_cross_cas_ordering_red.py

      - name: Install pinned symbolic and high-precision tools
        run: |
          python -m pip install --disable-pip-version-check \
            sympy==1.14.0 mpmath==1.3.0

      - name: Run seven-method GREEN contract
        run: |
          python -m unittest -v \
            tests.governance.test_rei_runtime_03a4_cross_cas_ordering_red

      - name: Emit deterministic methodology-only self-test
        run: |
          python \
            docs/rei_runtime_bridge_03a4_cross_cas/cross_cas_contract.py \
            --self-test | tee /tmp/rei-03a4-sympy-mpmath.json
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path('/tmp/rei-03a4-sympy-mpmath.json').read_text()
          )
          assert value['status'] == 'PASS_SYMPY_MPMATH_CHAIN_CONTRACT'
          assert value['authority_effect'] == 'NONE'
          assert value['mutation_effect'] == 'NONE'
          assert value['global_attempt_ref'] == 'ABSENT_REQUIRED'
          assert value['native_runtime'] == 'NOT_RUN'
          assert value['next_canonical_node'] == 'TARGET_HOST_STATIC_PREFLIGHT'
          PY

  octave:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y octave
      - name: Run independent Octave matrix witness
        run: |
          octave --quiet --no-gui \
            docs/rei_runtime_bridge_03a4_cross_cas/octave_verify.m \
            | tee /tmp/rei-03a4-octave.json
          grep -F 'PASS_OCTAVE_EXACT_CHAIN_WITNESS' \
            /tmp/rei-03a4-octave.json >/dev/null

  singular:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y singular
      - name: Run independent Singular Groebner witness
        run: |
          command -v Singular
          Singular -q \
            docs/rei_runtime_bridge_03a4_cross_cas/singular_verify.sing \
            | tee /tmp/rei-03a4-singular.json
          grep -F 'PASS_SINGULAR_BOOLEAN_IDEAL_WITNESS' \
            /tmp/rei-03a4-singular.json >/dev/null

  sage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run SageMath ideal and matrix witness in isolated image
        shell: bash
        run: |
          set -euo pipefail
          docker pull sagemath/sagemath:10.6
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            sagemath/sagemath:10.6 \
            sage -python \
            /work/docs/rei_runtime_bridge_03a4_cross_cas/sage_verify.py \
            | tee /tmp/rei-03a4-sage.json
          grep -F 'PASS_SAGEMATH_BOOLEAN_IDEAL_AND_MATRIX_WITNESS' \
            /tmp/rei-03a4-sage.json >/dev/null

  lean-mathlib:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert no placeholder proof tokens
        shell: bash
        run: |
          set -euo pipefail
          ! grep -En '\b(sorry|admit)\b' \
            docs/rei_runtime_bridge_03a4_cross_cas/lean/REI03A4.lean
      - name: Install elan without selecting an ambient toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib and build kernel-checked theorems
        working-directory: docs/rei_runtime_bridge_03a4_cross_cas/lean
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake update
          lake exe cache get
          lake build
          lake env lean REI03A4.lean

  live-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read exact ruleset and final attempt ref without mutation
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rei-03a4-cross-cas-green/v1',
          }
          ruleset_url = (
              'https://api.github.com/repos/cosmosapjw-quantum/'
              'rei_bianchi/rulesets/22240889'
          )
          with urllib.request.urlopen(
              urllib.request.Request(
                  ruleset_url, method='GET', headers=headers
              ),
              timeout=30,
          ) as response:
              ruleset = json.loads(response.read().decode('utf-8'))
          assert ruleset['enforcement'] == 'active'
          assert ruleset['conditions']['ref_name']['include'] == [
              'refs/heads/attempt-ledger/**'
          ]
          assert {row['type'] for row in ruleset['rules']} == {
              'update', 'deletion', 'non_fast_forward'
          }
          assert ruleset.get('bypass_actors', []) == []

          ref_url = (
              'https://api.github.com/repos/cosmosapjw-quantum/'
              'rei_bianchi/git/ref/heads/attempt-ledger/'
              'rei-runtime-bridge-ntpath-rebind-20260903-attempt-3'
          )
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(
                      ref_url, method='GET', headers=headers
                  ),
                  timeout=30,
              ) as response:
                  ref_status = response.status
          except urllib.error.HTTPError as exc:
              ref_status = exc.code
          assert ref_status == 404
          print(json.dumps({
              'status': 'PASS_LIVE_READ_ONLY_BOUNDARY',
              'ruleset_id': ruleset['id'],
              'ruleset_enforcement': ruleset['enforcement'],
              'global_attempt_ref': 'ABSENT_404',
              'authority_effect': 'NONE',
              'mutation_effect': 'NONE',
              'native_runtime': 'NOT_RUN',
          }, sort_keys=True))
          PY
      - name: Assert no attempt, preflight, or runtime state was created
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -type f \( \
            -name 'attempt-3.global-lease.json' -o \
            -name 'attempt-3.local-lease.json' -o \
            -name 'attempt-3.dispatch-intent.json' -o \
            -name 'attempt-3.outcome.json' -o \
            -name 'read-only-static-preflight-receipt.json' -o \
            -name 'successor-section0.json' \
          \) -print -quit)"

  aggregate:
    needs:
      - sympy-mpmath
      - octave
      - singular
      - sage
      - lean-mathlib
      - live-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close methodology-only cross-CAS sidecar
        run: |
          printf '%s\n' \
            'PASS_03A4_CROSS_CAS_NO_BYPASS_SIDECAR' \
            'authority_effect=NONE' \
            'mutation_effect=NONE' \
            'native_runtime=NOT_RUN' \
            'next_canonical_node=TARGET_HOST_STATIC_PREFLIGHT'
