name: event-bridge-02 native receipt

"on":
  push:
    branches: [research/he-event-bridge-02-20261012]
    paths:
      - .github/workflows/event-bridge-02.yml
      - research/event_bridge_20261012/build_and_capture.py
      - rust/rei_microphysics/**

permissions:
  contents: read

jobs:
  native-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_BACKTRACE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build and capture affected native tests
        run: >-
          python3 -B research/event_bridge_20261012/build_and_capture.py
          --output "$RUNNER_TEMP/event-bridge-02"
      - name: Preserve native binary, source, receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: event-bridge-02-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/event-bridge-02/event-bridge-02-native.tar.gz
            ${{ runner.temp }}/event-bridge-02/ARTIFACT_RECEIPT.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
