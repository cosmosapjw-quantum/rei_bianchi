name: rei-igm-tick160-original26-commonparent
on:
  push:
    branches: [research/rei-igm-tick160-original26-commonparent-20261101]
  pull_request:
    paths: [research/rei_igm_original26_commonparent_20261101/**, .github/workflows/rei-igm-tick160-original26-commonparent.yml]
permissions: {contents: read}
jobs:
  original-source-new-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - name: Install pinned original REI runtime
      run: |
        python -m pip install -r stages/Bianchi_Reionization_Stage_P0_5_B2C2B0C_R2C_R1B_R2B_R2A_R2_R1A_R1_R1_R1_R1_R1_R1_UNCERTAINTY_QUALIFIED_FIRST_CANONICAL_INTERVAL_ADAPTIVE_HISTORY/requirements-runtime.txt
        python -m pip check
    - name: Verify original source + local tests
      run: |
        echo "a861278201313c55e08ba6323b5c1d2ad97bf5765f429807b4eba0a1c2465d0b  stages/Bianchi_Reionization_Stage_P0_5_B2C2B0C_R2C_R1B_R2B_R2A_R2_R1A_R1_R1_R1_R1_R1_R1_UNCERTAINTY_QUALIFIED_FIRST_CANONICAL_INTERVAL_ADAPTIVE_HISTORY/local_results/first_interval_r2_blocked_minimum_step.tar.gz" | sha256sum -c -
        python -m py_compile research/rei_igm_original26_commonparent_20261101/science.py
        python -m unittest discover -s research/rei_igm_original26_commonparent_20261101/tests -v
    - name: Compute real 46080-node source thermal physics
      run: |
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
        python research/rei_igm_original26_commonparent_20261101/science.py --mode source --out source_physics
    - name: Validate all new physical rows
      run: |
        python - <<'PY'
        import gzip,csv,json,hashlib,pathlib,math
        p=pathlib.Path("source_physics")
        r=json.loads((p/"ORIGINAL_26EVENT_THERMAL_RESPONSE.json").read_text())
        b=(p/"ORIGINAL_26EVENT_THERMAL_RESPONSE_46080.csv.gz").read_bytes()
        assert hashlib.sha256(b).hexdigest()==r["csv_sha256"]
        with gzip.open(p/"ORIGINAL_26EVENT_THERMAL_RESPONSE_46080.csv.gz","rt") as f: a=list(csv.DictReader(f))
        assert len(a)==46080 and r["canonical_delta"]==0
        assert all(math.isfinite(float(v)) for row in a for k,v in row.items() if k!="node")
        print("REAL_PHYSICS_ROWS",len(a),"CENTRAL_DAG",r["DAG_central"])
        PY
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rei-igm-source26-thermal-response-46080
        path: source_physics/
        if-no-files-found: warn
  original-local-point-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: |
        python -m pip install -r stages/Bianchi_Reionization_Stage_P0_5_B2C2B0C_R2C_R1B_R2B_R2A_R2_R1A_R1_R1_R1_R1_R1_R1_UNCERTAINTY_QUALIFIED_FIRST_CANONICAL_INTERVAL_ADAPTIVE_HISTORY/requirements-runtime.txt
    - name: Execute original 26event MPRK SDIRK on same chosen parent at 160 to 161
      run: |
        export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
        python research/rei_igm_original26_commonparent_20261101/science.py --mode pair --out point_map
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rei-igm-original26-single-parent-tick160-map
        path: point_map/
        if-no-files-found: warn
