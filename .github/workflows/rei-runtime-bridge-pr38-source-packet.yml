name: rei-runtime-bridge-pr38-source-packet

on:
  pull_request:
    paths:
      - ".github/workflows/rei-runtime-bridge-pr38-source-packet.yml"
      - ".github/workflows/rei-runtime-bridge-ntpath-rebind-handoff.yml"
      - "handoff/rei_runtime_bridge_ntpath_rebind_20260903/SOURCE_PACKET_CONTRACT.json"
      - "handoff/rei_runtime_bridge_ntpath_rebind_20260903/SOURCE_PACKET_README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-exact-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify transfer-only ancestry and changed paths
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=3169d1b0554193ababfb568406764d53df29649d
          SOURCE_TREE=1fa2da1a818bb311bf6cec42f76ff05693ed0903
          test "$(git rev-parse "${SOURCE}^{tree}")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --name-only "$SOURCE"...HEAD > /tmp/rei-pr38-packet-paths.txt
          python3 - <<'PY'
          from pathlib import Path

          allowed = {
              ".github/workflows/rei-runtime-bridge-pr38-source-packet.yml",
              ".github/workflows/rei-runtime-bridge-ntpath-rebind-handoff.yml",
              "handoff/rei_runtime_bridge_ntpath_rebind_20260903/SOURCE_PACKET_CONTRACT.json",
              "handoff/rei_runtime_bridge_ntpath_rebind_20260903/SOURCE_PACKET_README.md",
          }
          paths = [line for line in Path("/tmp/rei-pr38-packet-paths.txt").read_text().splitlines() if line]
          if set(paths) != allowed:
              raise SystemExit(f"SOURCE_PACKET_CHANGED_PATH_MISMATCH:{paths!r}")
          print({"changed_paths": len(paths), "unexpected": 0})
          PY

      - name: Build and verify compact exact source packet
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=3169d1b0554193ababfb568406764d53df29649d
          SOURCE_TREE=1fa2da1a818bb311bf6cec42f76ff05693ed0903
          OUT="$RUNNER_TEMP/rei-pr38-compact-source-packet"
          EXTRACT="$RUNNER_TEMP/rei-pr38-compact-source-extract"
          ARCHIVE="$OUT/rei_runtime_bridge_pr38_compact_inspection.tar.gz"
          mkdir -p "$OUT" "$EXTRACT"

          git archive --format=tar --prefix=rei_bianchi-pr38-compact/ "$SOURCE" \
            handoff/rei_runtime_bridge_ntpath_rebind_20260903 \
            stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/INPUT_LOCK.json \
            stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/analysis/rust_source_bound_thermal.py \
            stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/rust/source_bound_thermal.rs \
            stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/rust/BUILD_RECEIPT.json \
            stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/RUST_IMPLEMENTATION_AMENDMENT.json \
            | gzip -n -9 > "$ARCHIVE"

          cp handoff/rei_runtime_bridge_ntpath_rebind_20260903/SOURCE_PACKET_CONTRACT.json "$OUT/"
          cp handoff/rei_runtime_bridge_ntpath_rebind_20260903/SOURCE_PACKET_README.md "$OUT/"

          tar -xzf "$ARCHIVE" -C "$EXTRACT"
          ROOT="$EXTRACT/rei_bianchi-pr38-compact"
          test -d "$ROOT/handoff/rei_runtime_bridge_ntpath_rebind_20260903"

          test "$(sha256sum "$ROOT/stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/INPUT_LOCK.json" | cut -d' ' -f1)" \
            = 20db870e76ff8a82f2b6f6d38d90eb915b73d5564d6dfbee60a524862ab2e989
          test "$(sha256sum "$ROOT/stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/analysis/rust_source_bound_thermal.py" | cut -d' ' -f1)" \
            = 91fe316f1e8b81d64e9929d7a4814b77808fdf486e2ca67cd2f615e8617fce85
          test "$(sha256sum "$ROOT/stages/REI_LOCAL_01_SOURCE_BOUND_PAIRED_MAP_ADAPTER/rust/source_bound_thermal.rs" | cut -d' ' -f1)" \
            = c4dd1f21200faab60e239e96b56d1eb3d2691c47dc3d3a4991af7565ce0a9d51

          (
            cd "$ROOT"
            PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -I -S -B \
              handoff/rei_runtime_bridge_ntpath_rebind_20260903/test_runtime_bridge_runner.py
          )

          test "$(stat -c %s "$ARCHIVE")" -lt 536870912

          python3 - "$OUT" "$SOURCE" "$SOURCE_TREE" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          source = sys.argv[2]
          source_tree = sys.argv[3]
          files = {}
          for name in (
              "rei_runtime_bridge_pr38_compact_inspection.tar.gz",
              "SOURCE_PACKET_CONTRACT.json",
              "SOURCE_PACKET_README.md",
          ):
              path = out / name
              files[name] = {
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          receipt = {
              "schema": "rei-runtime-bridge-compact-source-packet-receipt/v2",
              "status": "PASS_COMPACT_EXACT_SOURCE_PACKET",
              "source_commit": source,
              "source_tree": source_tree,
              "files": files,
              "portable_handoff_tests": {"passed": 10, "failed": 0},
              "key_source_hashes": "PASS",
              "artifact_below_512_mib": True,
              "oversized_predecessor_artifact": {
                  "artifact_id": 9877661352,
                  "bytes": 1294322295,
                  "sha256": "dade8db6731f780dc90e8e8d066c62c27ea6bb009e99373366f63ec8c7c56369"
              },
              "native_runtime": "NOT_RUN",
              "section0_receipt": "NOT_INCLUDED_HOST_BOUND_INPUT",
              "rust_toolchain": "NOT_INCLUDED_HOST_BOUND_INPUT",
              "claim_ceiling": {
                  "runtime_bridge": "STOP_INVALID_UNTIL_FRESH_RESULT_AUDIT",
                  "first_interval": "NO_PASS_FIRST_CANONICAL_INTERVAL",
                  "provider_export": "NOT_AUTHORIZED",
                  "scientific_pass": "NOT_CLAIMED"
              }
          }
          (out / "SOURCE_PACKET_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8"
          )
          PY

          (
            cd "$OUT"
            sha256sum \
              rei_runtime_bridge_pr38_compact_inspection.tar.gz \
              SOURCE_PACKET_CONTRACT.json \
              SOURCE_PACKET_README.md \
              SOURCE_PACKET_RECEIPT.json \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          test ! -e /tmp/rei-runtime-bridge-ntpath-rebind-20260903.native-attempt.json
          echo NATIVE_RUNTIME_NOT_RUN

      - name: Upload compact PR38 source packet
        uses: actions/upload-artifact@v4
        with:
          name: rei-runtime-bridge-pr38-compact-source-packet
          path: ${{ runner.temp }}/rei-pr38-compact-source-packet/*
          if-no-files-found: error
          retention-days: 90
