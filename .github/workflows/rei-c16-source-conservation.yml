name: rei-c16-source-conservation
on:
  push:
    branches:
      - research/rei-c16-source-energy-20261015
  pull_request:
    paths:
      - 'research/rei_c16_source_energy_20261015/**'
      - 'research/rei_c15_two_way_shear_20261015/**'
      - '.github/workflows/rei-c16-source-conservation.yml'
jobs:
  c16-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-locked Python numerical environment
        run: python -m pip install --disable-pip-version-check numpy==2.4.2 scipy==1.17.0 matplotlib==3.10.8
      - name: Verify C16 actual native source energy and shear-work contract
        run: python research/rei_c16_source_energy_20261015/test_c16_exchange.py
      - name: Verify original C15 Einstein and chemistry output remains unchanged
        run: python research/rei_c15_two_way_shear_20261015/test_c15_coupled.py
      - name: Verify source C13 stellar spectra and Case-A H-He regression
        run: python -m unittest discover -s research/rei_c13_live_source_20261015 -p 'test_*.py' -v
      - name: Verify C14 photon and neutrino hierarchy/source-donor regression
        run: python -m unittest discover -s research/rei_c14_thomson_receiver_20261015 -p 'test_*.py' -v
