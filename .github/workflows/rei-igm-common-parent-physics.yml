name: rei-igm-common-parent-physics
on:
  push:
    branches: [research/rei-igm-first-interval-common-parent-20261101]
  pull_request:
    paths: [research/rei_igm_first_interval_common_parent_20261101/**, .github/workflows/rei-igm-common-parent-physics.yml]
permissions:
  contents: read
jobs:
  authentic-frozen-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original accepted-state parser requirement
        run: python -m pip install numpy==2.1.3
      - name: Verify mathematics and source-state parser
        run: python -m unittest discover -s research/rei_igm_first_interval_common_parent_20261101/tests -v
      - name: Calculate actual frozen-run blocker and exact positive H limiting response
        run: python research/rei_igm_first_interval_common_parent_20261101/code/paired_defect.py
      - name: Extract actual source-authentic H-He-T accepted-state physics
        run: |
          python research/rei_igm_first_interval_common_parent_20261101/code/physical_probe.py \
            --archive 'stages/Bianchi_Reionization_Stage_P0_5_B2C2B0C_R2C_R1B_R2B_R2A_R2_R1A_R1_R1_R1_R1_R1_R1_UNCERTAINTY_QUALIFIED_FIRST_CANONICAL_INTERVAL_ADAPTIVE_HISTORY/local_results/first_interval_r2_blocked_minimum_step.tar.gz' \
            --output source_science/ORIGINAL_H_HE_T_ENERGY.json
      - name: Preserve actual source physics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rei-igm-first-interval-real-partial-history
          path: source_science/ORIGINAL_H_HE_T_ENERGY.json
          if-no-files-found: warn
