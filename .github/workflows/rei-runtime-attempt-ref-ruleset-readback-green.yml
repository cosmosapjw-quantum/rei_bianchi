name: rei-runtime-attempt-ref-ruleset-readback-green

on:
  push:
    branches:
      - fix/rei-runtime-attempt-ref-ruleset-readback-green-20260904-r1
  pull_request:
    paths:
      - "docs/rei_runtime_bridge_03a3r3_independent_readback/**"
      - "tests/governance/test_rei_runtime_attempt_ref_ruleset_independent_readback_red.py"
      - ".github/workflows/rei-runtime-attempt-ref-ruleset-readback-green.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REI_NATIVE_DISPATCH_FORBIDDEN: "1"

jobs:
  verify-independent-readback-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert executed RED ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            6827ec513cdee78fbc808e08692cab3b7dfc915e HEAD

      - name: Compile independent auditor source
        run: |
          python -m py_compile \
            docs/rei_runtime_bridge_03a3r3_independent_readback/independent_readback_audit.py \
            docs/rei_runtime_bridge_03a3r3_independent_readback/verify_source_index.py \
            tests/governance/test_rei_runtime_attempt_ref_ruleset_independent_readback_red.py

      - name: Run nine-method GREEN contract suite
        run: |
          python -m unittest -v \
            tests.governance.test_rei_runtime_attempt_ref_ruleset_independent_readback_red

      - name: Run credential-free self-test
        run: |
          python \
            docs/rei_runtime_bridge_03a3r3_independent_readback/independent_readback_audit.py \
            --self-test

      - name: Verify exact source index against HEAD
        run: |
          python \
            docs/rei_runtime_bridge_03a3r3_independent_readback/verify_source_index.py

      - name: Read current live administrative state without mutation
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "rei-runtime-readback-green-ci/v1",
          }
          ruleset_request = urllib.request.Request(
              "https://api.github.com/repos/cosmosapjw-quantum/rei_bianchi/rulesets",
              method="GET",
              headers=headers,
          )
          with urllib.request.urlopen(ruleset_request, timeout=30) as response:
              rulesets = json.loads(response.read().decode("utf-8"))
          if not isinstance(rulesets, list):
              raise SystemExit("STOP_INVALID: RULESET_LIST_NOT_LIST")

          ref_request = urllib.request.Request(
              "https://api.github.com/repos/cosmosapjw-quantum/rei_bianchi/"
              "git/ref/heads/attempt-ledger/"
              "rei-runtime-bridge-ntpath-rebind-20260903-attempt-3",
              method="GET",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(ref_request, timeout=30) as response:
                  ref_status = response.status
          except urllib.error.HTTPError as exc:
              ref_status = exc.code
          if ref_status != 404:
              raise SystemExit(
                  f"STOP_INVALID: GLOBAL_ATTEMPT_REF_HTTP_{ref_status}"
              )
          print(json.dumps({
              "ruleset_count": len(rulesets),
              "global_attempt_ref": "ABSENT_404",
              "mutation_effect": "NONE",
              "native_runtime": "NOT_RUN",
          }, sort_keys=True))
          PY

      - name: Assert no audit output or attempt state was created
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -type f \( \
            -name 'INDEPENDENT_AUDIT_RECEIPT.json' -o \
            -name 'AUDITED_FRESH_SOURCE_PROTECTION_RECEIPT.json' -o \
            -name 'attempt-3.global-lease.json' -o \
            -name 'attempt-3.local-lease.json' -o \
            -name 'attempt-3.dispatch-intent.json' -o \
            -name 'attempt-3.outcome.json' \
          \) -print -quit)"
