name: rei-h1b1-deb-member-census
on:
  push:
    branches: [implementation/rei-h1b1-deb-member-20260905-r1]
  pull_request:
    paths:
      - 'docs/rei_runtime_03a4_h1b1_snapshot_package_census/**'
      - '.github/workflows/rei-h1b1-deb-member-census.yml'
permissions:
  contents: read
jobs:
  authenticated-members:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and preserved donor
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          P=docs/rei_runtime_03a4_h1b1_snapshot_package_census
          test "$(git rev-parse "HEAD:$P/signed_archive_chain.py")" = a530ec095cca5a9347cb419f0ef9cb5632e39ed1
          test "$(git rev-parse "HEAD:$P/test_signed_archive_chain.py")" = d47308ca29b7a4fdd8c02ca03060f977d5e7716f
          test -f "$P/deb_member_census.py"
          command -v python3
          command -v gpg
          command -v gpgv
          command -v dpkg-deb
          mkdir "$RUNNER_TEMP/rei-deb-member-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/rei-deb-member-evidence/HEAD.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/rei-deb-member-evidence/TREE.txt"
          python3 -B - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('docs/rei_runtime_03a4_h1b1_snapshot_package_census/test_deb_member_census.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'caff1db84874217e934063e49487db75b6f71549f0373fa7d4f55c7bb25aec6f'
          PY
      - name: Frozen member suite and donor regression
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess, time
          p = pathlib.Path('docs/rei_runtime_03a4_h1b1_snapshot_package_census').resolve()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rei-deb-member-evidence'
          commands = [
              ('members', ['python3', '-B', str(p / 'test_deb_member_census.py'), '--report', str(out / 'members.json'), '--evidence-dir', str(out / 'public-fixtures')]),
              ('donor', ['python3', '-B', str(p / 'test_signed_archive_chain.py'), '--report', str(out / 'donor.json')]),
              ('repository', ['python3', '-B', 'scripts/verify_repo.py']),
          ]
          records = []
          for label, argv in commands:
              start = time.monotonic()
              timed_out = False
              with (out / (label + '.stdout.log')).open('xb') as so, (out / (label + '.stderr.log')).open('xb') as se:
                  try:
                      code = subprocess.run(argv, stdout=so, stderr=se, timeout=180).returncode
                  except subprocess.TimeoutExpired:
                      code, timed_out = None, True
              records.append(dict(label=label, argv=argv, exit_code=code, timed_out=timed_out,
                                  timeout_seconds=180, elapsed_seconds=time.monotonic()-start, invocation_count=1))
              (out / 'commands.json').write_text(json.dumps(records, indent=2) + '\n')
              assert code == 0 and not timed_out, records[-1]
          member = json.loads((out / 'members.json').read_text())
          donor = json.loads((out / 'donor.json').read_text())
          assert (member['tests'], member['passed'], member['failures'], member['errors'], member['skipped'], member['not_run']) == (15, 15, 0, 0, 0, 0)
          assert member['successful'] and not member['expected_implementation_absent_red']
          assert (donor['tests'], donor['failures'], donor['errors'], donor['skipped']) == (18, 0, 0, 0)
          assert donor['successful'] and not donor['expected_implementation_absent_red']
          print('PASS: 15 member methods; 18 donor methods separately; repository verifier')
          PY
      - name: Source and artifact member identities
        if: always()
        run: |
          set -eu
          OUT="$RUNNER_TEMP/rei-deb-member-evidence"
          if test -d "$OUT"; then
            git archive --format=zip HEAD \
              docs/rei_runtime_03a4_h1b1_snapshot_package_census \
              .github/workflows/rei-h1b1-deb-member-census.yml > "$OUT/SOURCE.zip"
            python3 -B - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rei-deb-member-evidence'
          files = {str(p.relative_to(out)): {'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'size': p.stat().st_size}
                   for p in sorted(out.rglob('*')) if p.is_file() and p.name != 'FILES.json'}
          (out / 'FILES.json').write_text(json.dumps({'files': files, 'self_excluded': 'FILES.json'}, indent=2) + '\n')
          PY
          fi
          git diff --check edec9771c1e725484ec1a7250ba0d340eb13e21b HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rei-h1b1-deb-members-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: ${{ runner.temp }}/rei-deb-member-evidence/
          if-no-files-found: error
