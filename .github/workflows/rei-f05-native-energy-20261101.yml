name: rei-f05-source-locked-native-sdirk-energy
on:
  push:
    branches: [research/rei-physical-fast-f05-energy-budget-20261101]
  pull_request:
    paths:
      - 'research/rei_f05_one_tick_thermochemical_energy_20261101/**'
      - '.github/workflows/rei-f05-native-energy-20261101.yml'
permissions: {contents: read}
jobs:
  original-26event-thermal-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane:
          - LOCAL_NEUTRAL_HAZARD_PRIMARY
          - RECOMBINATION_WEIGHTED_AUDITOR
          - SCRIPT_SELF_SHIELDING_AUDITOR
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact frozen original source owner runtime
        run: |
          stage=$(find stages -maxdepth 1 -type d -name '*UNCERTAINTY_QUALIFIED_FIRST_CANONICAL_INTERVAL_ADAPTIVE_HISTORY' -print -quit)
          test -n "$stage" && test -f "$stage/requirements-runtime.txt"
          python -m pip install -r "$stage/requirements-runtime.txt"
          python -m pip check
      - name: Mathematical source-energy and original parent-contract tests
        run: |
          python -m py_compile research/rei_f05_one_tick_thermochemical_energy_20261101/energy_ledger.py
          python -m unittest discover -s research/rei_f05_one_tick_thermochemical_energy_20261101/tests -v
          python -O -m unittest discover -s research/rei_f05_one_tick_thermochemical_energy_20261101/tests -v
          python -m unittest discover -s research/rei_igm_original26_temperature_edges_20261101/tests -v
      - name: Original 46k physical source + native root energy for [160,161]
        run: |
          python research/rei_f05_one_tick_thermochemical_energy_20261101/energy_ledger.py \
            --repo . --lane '${{ matrix.lane }}' --out 'source_science/${{ matrix.lane }}'
      - name: Verify physical output and prevent false canonical promotion
        run: |
          python - <<'PY'
          import json, csv, gzip, hashlib, math
          from pathlib import Path
          rpath=Path('source_science/${{ matrix.lane }}')
          r=json.loads((rpath/'RESULT.json').read_text())
          assert r['status']=='ORIGINAL_26EVENT_FULL_PARENT_DISCRETE_ENERGY_CHECKED_NOT_JOINT_DH_CERTIFIED'
          assert r['input']['source_tar_sha256']=='a861278201313c55e08ba6323b5c1d2ad97bf5765f429807b4eba0a1c2465d0b'
          assert r['input']['source_array_sha256']=='cc031a04f5b7b13ccb9ffddf95ec0ced4a9274a9ab999a9e7e3508a5161edb01'
          assert r['input']['kernel_sha256']=='579df3cc99987dcce9205166752570bdaf4c7cb3640c525be6da260d94b8e644'
          assert r['actual_unique_source_nodes']==46080 and r['actual_original_native_source_sites']==12
          assert r['actual_original_gamma_final_roots']==6
          assert r['full_source_correlated_dh_remainder_certified'] is False
          assert r['central_dag']=='28/88_REPORTED' and r['physical_fast_dag']=='4/7_REPORTED'
          assert r['canonical_delta']==0 and r['production']=='HOLD' and r['auto_next_node'] is False
          assert r['original_local_logT_limit']==2e-4 and r['original_public_width_limit']==2e-3
          assert abs(r['max_original_logT_independent_crossbox']-2.1245050576368385e-4)<1e-12
          assert set(r['steps'])=={'full','half1','half2'}
          assert all(s['certified'] and s['root_residual_zero_included_nodes']==46080 and
                     len(s['sites'])==4 and s['thermal_root_calls']>=3 for s in r['steps'].values())
          assert len(r['scientific_result'])==9
          f=rpath/r['csv_file']
          assert hashlib.sha256(f.read_bytes()).hexdigest()==r['csv_sha256']
          with gzip.open(f,'rt',newline='') as src:
              reader=csv.DictReader(src)
              assert len(reader.fieldnames)==r['csv_columns']
              count=0
              for row in reader:
                  count+=1
                  assert len(row)==r['csv_columns'] and all(
                      math.isfinite(float(v)) for k,v in row.items() if k!='node')
              assert count==46080==r['csv_rows']
          print('AUTHENTIC_NATIVE_ENERGY',r['lane'],
                'ROWS',count,
                'GLOBAL_INTEGRATED_PHOTOHEAT_FULL_ERG',
                r['scientific_result']['photo_total']['center_total_full_erg'],
                'GLOBAL_INTEGRATED_PHOTOHEAT_TWOHALF_ERG',
                r['scientific_result']['photo_total']['center_total_twohalf_erg'],
                'ORIGINAL_160_161','BLOCKED',
                'CENTRAL',r['central_dag'])
          PY
      - name: Preserve physical inputs/outputs and failures as Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rei-f05-original-native-energy-${{ matrix.lane }}
          path: source_science/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 90
