name: rei-math-m1-spatial-curvature-green

on:
  push:
    branches:
      - research/rei-math-m1-spatial-curvature-green-20260904-r1
    paths:
      - "tests/research/test_rei_math_m1_spatial_curvature_red.py"
      - "research/rei_math_m1_generic_background/**"
      - ".github/workflows/rei-math-m1-spatial-curvature-red.yml"
  pull_request:
    paths:
      - "tests/research/test_rei_math_m1_spatial_curvature_red.py"
      - "research/rei_math_m1_generic_background/**"
      - ".github/workflows/rei-math-m1-spatial-curvature-red.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REI_NATIVE_DISPATCH_FORBIDDEN: "1"

jobs:
  symbolic-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert executed RED ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            5736882a3007109fab74a640fab71ff4df85db58 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned symbolic oracle dependency
        run: |
          python -m pip install --disable-pip-version-check \
            'sympy==1.13.3'

      - name: Compile oracle and former RED suite
        run: |
          python -m py_compile \
            research/rei_math_m1_generic_background/derive_spatial_curvature.py \
            tests/research/test_rei_math_m1_spatial_curvature_red.py

      - name: Run former RED as GREEN
        run: |
          python -m unittest -v \
            tests.research.test_rei_math_m1_spatial_curvature_red

      - name: Run generic symbolic audit
        shell: bash
        run: |
          set -euo pipefail
          python \
            research/rei_math_m1_generic_background/derive_spatial_curvature.py \
            | tee spatial-curvature-audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path('spatial-curvature-audit.json').read_text())
          audit = record['symbolic_audit']
          assert audit['ricci_residuals_mod_jacobi'] == [['0'] * 3 for _ in range(3)]
          assert audit['scalar_residual_mod_jacobi'] == '0'
          assert audit['codazzi_divergence_residuals'] == ['0', '0', '0']
          assert record['sentinels']['I']['scalar'] == '0'
          assert record['sentinels']['V']['scalar'] == '-6*A**2'
          assert record['sentinels']['IX']['scalar'] == '3*N**2/2'
          assert audit['native_runtime'] == 'NOT_RUN'
          print('classification=PASS_REI_MATH_M1_GENERIC_SPATIAL_CURVATURE_SYMBOLIC_AUDIT')
          PY

      - name: Assert runtime lane remained untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -type f \( \
            -name 'successor-section0.json' -o \
            -name 'read-only-static-preflight-receipt.json' -o \
            -name 'attempt-3.global-lease.json' -o \
            -name 'attempt-3.local-lease.json' -o \
            -name 'attempt-3.dispatch-intent.json' -o \
            -name 'attempt-3.outcome.json' \
          \) -print -quit)"
