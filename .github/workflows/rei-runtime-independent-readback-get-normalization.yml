name: rei-runtime-independent-readback-get-normalization

on:
  push:
    branches:
      - fix/rei-runtime-independent-readback-get-normalization-20260904-r1
  pull_request:
    paths:
      - "docs/rei_runtime_bridge_03a3r3_independent_readback/**"
      - "docs/rei_runtime_bridge_03a3r2_admin_ruleset/**"
      - "tests/governance/test_rei_runtime_independent_readback_get_normalization.py"
      - ".github/workflows/rei-runtime-independent-readback-get-normalization.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REI_NATIVE_DISPATCH_FORBIDDEN: "1"

jobs:
  normalized-independent-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact normalized-admin parent ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            4917fbd472bbb71ff0e170222433dea951f63cb8 HEAD

      - name: Compile focused auditor contract
        run: |
          python -m py_compile \
            docs/rei_runtime_bridge_03a3r3_independent_readback/independent_readback_audit.py \
            docs/rei_runtime_bridge_03a3r3_independent_readback/independent_readback_audit_v2.py \
            tests/governance/test_rei_runtime_independent_readback_get_normalization.py

      - name: Run focused normalization contract
        run: |
          python -m unittest -v \
            tests.governance.test_rei_runtime_independent_readback_get_normalization

      - name: Read exact global attempt ref without mutation
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = (
              "https://api.github.com/repos/cosmosapjw-quantum/rei_bianchi/"
              "git/ref/heads/attempt-ledger/"
              "rei-runtime-bridge-ntpath-rebind-20260903-attempt-3"
          )
          request = urllib.request.Request(
              url,
              method="GET",
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "rei-independent-readback-normalization-ci/v1",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              status = exc.code
          if status != 404:
              raise SystemExit(
                  f"STOP_INVALID: GLOBAL_ATTEMPT_REF_HTTP_{status}"
              )
          print(json.dumps({
              "global_attempt_ref": "ABSENT_404",
              "mutation_effect": "NONE",
              "native_runtime": "NOT_RUN",
          }, sort_keys=True))
          PY

      - name: Assert no attempt or audit state was created
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -type f \( \
            -name 'INDEPENDENT_AUDIT_RECEIPT.json' -o \
            -name 'AUDITED_FRESH_SOURCE_PROTECTION_RECEIPT.json' -o \
            -name 'attempt-3.global-lease.json' -o \
            -name 'attempt-3.local-lease.json' -o \
            -name 'attempt-3.dispatch-intent.json' -o \
            -name 'attempt-3.outcome.json' \
          \) -print -quit)"
