name: rei-runtime-03a4-toolchain-path-binding-behavior-green

on:
  push:
    branches:
      - fix/rei-runtime-03a4-toolchain-path-binding-green-20260904-r1
    paths:
      - "handoff/rei_runtime_prelease_import_firewall_green_20260903/**"
      - "handoff/rei_runtime_attempt_ref_protection_freshness_20260904/**"
      - "docs/rei_runtime_bridge_03a4_toolchain_path_binding/**"
      - "tests/governance/test_rei_runtime_03a4_toolchain_path_binding_red.py"
      - "tests/governance/test_rei_runtime_03a4_toolchain_path_binding_behavior.py"
      - "tests/governance/test_rei_runtime_03a4_active_freshness_path_binding.py"
      - ".github/workflows/rei-runtime-03a4-toolchain-path-binding-behavior-red.yml"
  pull_request:
    paths:
      - "handoff/rei_runtime_prelease_import_firewall_green_20260903/**"
      - "handoff/rei_runtime_attempt_ref_protection_freshness_20260904/**"
      - "docs/rei_runtime_bridge_03a4_toolchain_path_binding/**"
      - "tests/governance/test_rei_runtime_03a4_toolchain_path_binding_red.py"
      - "tests/governance/test_rei_runtime_03a4_toolchain_path_binding_behavior.py"
      - "tests/governance/test_rei_runtime_03a4_active_freshness_path_binding.py"
      - ".github/workflows/rei-runtime-03a4-toolchain-path-binding-behavior-red.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REI_NATIVE_DISPATCH_FORBIDDEN: "1"

jobs:
  verify-path-binding-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact intentional RED ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            2b2b717283e070c0d07b632e3a7eb99649f2044f HEAD
          git merge-base --is-ancestor \
            3fd6a63741ec7553621e4afa11793bf28ac81c20 HEAD

      - name: Compile active path-bound sources and tests
        run: |
          python -m py_compile \
            handoff/rei_runtime_prelease_import_firewall_green_20260903/common_v2.py \
            handoff/rei_runtime_prelease_import_firewall_green_20260903/common_v3_impl.py \
            handoff/rei_runtime_prelease_import_firewall_green_20260903/successor_section0_preflight_bound_impl.py \
            handoff/rei_runtime_prelease_import_firewall_green_20260903/successor_runtime_controller.py \
            handoff/rei_runtime_prelease_import_firewall_green_20260903/native_runtime_worker.py \
            handoff/rei_runtime_attempt_ref_protection_freshness_20260904/lease_bound.py \
            handoff/rei_runtime_attempt_ref_protection_freshness_20260904/successor_runtime_controller.py \
            handoff/rei_runtime_attempt_ref_protection_freshness_20260904/native_runtime_worker.py \
            tests/governance/test_rei_runtime_03a4_toolchain_path_binding_red.py \
            tests/governance/test_rei_runtime_03a4_toolchain_path_binding_behavior.py \
            tests/governance/test_rei_runtime_03a4_active_freshness_path_binding.py

      - name: Turn both executed behavior REDs GREEN
        run: |
          python -m unittest -v \
            tests.governance.test_rei_runtime_03a4_toolchain_path_binding_behavior \
            tests.governance.test_rei_runtime_03a4_active_freshness_path_binding

      - name: Verify compiler-provenance receipt boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "docs/rei_runtime_bridge_03a4_toolchain_path_binding/"
              "COMPILER_PROVENANCE_RECEIPT.json"
          )
          value = json.loads(path.read_text(encoding="utf-8"))
          assert value["schema"] == "rei-runtime-03a4-compiler-provenance/v1"
          assert value["status"] == (
              "PASS_LOCKED_CC_PACKAGE_IDENTIFIED_PROVENANCE_ONLY"
          )
          assert value["identified_package"]["version"] == (
              "13.3.0-6ubuntu2~24.04"
          )
          assert value["identified_package"]["compiler_sha256"] == (
              "6117c52522997d2aaccb2b52b3c6bf42c0a6c5edb1d718431fed6b2fc5fec234"
          )
          assert value["identified_package"]["matches_semantic_lock"] is True
          assert value["effects"]["authorization_effect"] == "NONE"
          assert value["effects"]["native_runtime"] == "NOT_RUN"
          assert value["effects"]["remaining_native_attempts"] == 1
          print("classification=PASS_COMPILER_PROVENANCE_SOURCE_BOUNDARY")
          PY

      - name: Assert no execution state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -type f \( \
            -name 'successor-section0.json' -o \
            -name 'read-only-static-preflight-receipt.json' -o \
            -name 'attempt-3.global-lease.json' -o \
            -name 'attempt-3.local-lease.json' -o \
            -name 'attempt-3.dispatch-intent.json' -o \
            -name 'attempt-3.outcome.json' \
          \) -print -quit)"
          printf '%s\n' \
            'classification=PASS_03A4_ACTIVE_RUNTIME_PATH_BINDING_BEHAVIOR'
