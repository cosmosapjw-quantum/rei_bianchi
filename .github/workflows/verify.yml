name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --manifest-path rust/rei_microphysics/Cargo.toml --all -- --check
      - run: cargo test --manifest-path rust/rei_microphysics/Cargo.toml --workspace --locked
