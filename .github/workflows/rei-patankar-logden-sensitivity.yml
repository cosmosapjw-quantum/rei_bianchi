name: rei-patankar-logden-sensitivity
on:
  push:
    branches: [research/rei-patankar-logden-sensitivity-20260907-r1]
  pull_request:
    paths:
      - 'research/rei_patankar_logden_sensitivity_20260907/**'
      - '.github/workflows/rei-patankar-logden-sensitivity.yml'
permissions:
  contents: read
jobs:
  exact-logden-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source and new rational-dual checks
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git merge-base --is-ancestor 032b59372e55bdbb86860e8075206bd0026f7be1 HEAD
          OUT="$RUNNER_TEMP/rei-logden-evidence"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/TREE.txt"
          python3 -B research/rei_patankar_logden_sensitivity_20260907/verify_sensitivity.py \
            --report "$OUT/RESULT.json" 2>&1 | tee "$OUT/checks.log"
          python3 -B scripts/verify_repo.py 2>&1 | tee "$OUT/repository.log"
          git diff --check 032b59372e55bdbb86860e8075206bd0026f7be1 HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Evidence manifest
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/rei-logden-evidence"
          if test -d "$OUT"; then
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rei-logden-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: ${{ runner.temp }}/rei-logden-evidence/
          if-no-files-found: error
