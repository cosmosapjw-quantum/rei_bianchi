name: Monitor rec_bianchi dependency

on:
  workflow_dispatch:
  schedule:
    # Monday 09:15 Asia/Seoul = Monday 00:15 UTC
    - cron: '15 0 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require read-only dependency token
        env:
          TOKEN: ${{ secrets.REC_BIANCHI_READ_TOKEN }}
        run: |
          test -n "$TOKEN" || {
            echo 'REC_BIANCHI_READ_TOKEN is not configured.' >&2
            exit 2
          }
      - name: Query private rec_bianchi HEAD
        env:
          TOKEN: ${{ secrets.REC_BIANCHI_READ_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          REMOTE=https://github.com/cosmosapjw-quantum/rec_bianchi.git
          HEAD_LINE=$(git -c http.extraHeader="AUTHORIZATION: basic $AUTH" \
            ls-remote "$REMOTE" HEAD)
          SHA=${HEAD_LINE%%[[:space:]]*}
          COMMITTED=$(jq -r '.head_sha // empty' external/rec_bianchi.lock.json)
          CHECKED_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg sha "$SHA" \
            --arg committed "$COMMITTED" \
            --arg checked "$CHECKED_UTC" \
            '{repository: "https://github.com/cosmosapjw-quantum/rec_bianchi",
              checked_utc: $checked,
              remote_head_sha: $sha,
              committed_head_sha: (if $committed == "" then null else $committed end),
              changed_since_committed_lock: ($committed != "" and $committed != $sha)}' \
            > rec_bianchi_monitor_receipt.json
          cat rec_bianchi_monitor_receipt.json
          if jq -e '.changed_since_committed_lock' rec_bianchi_monitor_receipt.json >/dev/null; then
            echo 'rec_bianchi HEAD changed; review and update the lock intentionally' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec-bianchi-monitor-receipt
          path: rec_bianchi_monitor_receipt.json
