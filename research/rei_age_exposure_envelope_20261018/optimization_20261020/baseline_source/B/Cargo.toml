[package]
name = "rei-vigilode-age-transport"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[features]
reference-check = []

[dependencies]
rayon = "=1.12.0"
num-rational = "=0.4.2"
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }

[profile.release]
opt-level = 2
debug = false
strip = true

[workspace]
